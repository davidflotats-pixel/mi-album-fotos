<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi álbum de fotos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f1f0ec;
  --text:#1a1a18;--text2:#5a5a56;--text3:#9a9a94;
  --border:#e5e5e0;--border2:#d0d0c8;
  --blue:#378ADD;--blue-dark:#185FA5;
  --green:#639922;--green-dark:#3B6D11;
  --red:#E24B4A;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#272724;--bg3:#2f2f2c;
  --text:#e8e8e4;--text2:#aaa9a4;--text3:#6a6a65;
  --border:#3a3a36;--border2:#4a4a46;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:14px}
.app{display:flex;height:100vh;min-height:600px}
.sidebar{width:220px;flex-shrink:0;background:var(--bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-title{padding:16px;font-size:16px;font-weight:500;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar-section{padding:12px 16px 4px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;color:var(--text2);transition:background .1s}
.sidebar-item:hover{background:var(--bg2);color:var(--text)}
.sidebar-item.active{background:var(--bg2);color:var(--text);font-weight:500}
.sidebar-item i{font-size:16px}
.tag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 20px;background:var(--bg);border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h2{font-size:16px;font-weight:500;flex:1}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap i{position:absolute;left:8px;font-size:15px;color:var(--text3);pointer-events:none}
.search-input{padding:6px 10px 6px 30px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg2);color:var(--text);width:160px;outline:none}
.search-input:focus{border-color:var(--blue)}
.btn{padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:13px;cursor:pointer;background:var(--bg);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:background .1s}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--blue);border-color:var(--blue-dark);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-success{background:var(--green);border-color:var(--green-dark);color:#fff}
.btn-success:hover{background:var(--green-dark)}
.btn-danger{background:#fff0f0;border-color:#fcc;color:var(--red)}
.btn-danger:hover{background:#ffe0e0}
.content{flex:1;overflow-y:auto;padding:20px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:0.5px solid transparent;transition:all .1s;user-select:none}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo-card{border-radius:var(--radius);overflow:hidden;border:0.5px solid var(--border);background:var(--bg);transition:transform .15s;position:relative}
.photo-card:hover{transform:scale(1.02)}
.photo-card:hover .card-actions{opacity:1}
.card-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card-btn{width:28px;height:28px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text2)}
.card-btn:hover{background:var(--bg2);color:var(--text)}
.photo-thumb{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photo-thumb-fake{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:42px;background:var(--bg2)}
.photo-info{padding:7px 10px}
.photo-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.mini-tag{font-size:10px;padding:1px 6px;border-radius:10px}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty i{font-size:42px;display:block;margin-bottom:12px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);width:100%;max-width:360px;padding:20px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{font-size:13px;color:var(--text2);display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg2);color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.check-grid{display:flex;flex-wrap:wrap;gap:6px}
.check-tag{padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);user-select:none}
.check-tag.sel{border-color:var(--blue);background:#e6f1fb;color:var(--blue-dark)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.export-option{display:flex;align-items:center;gap:12px;padding:11px;border:0.5px solid var(--border);border-radius:var(--radius);cursor:pointer;margin-bottom:8px;transition:background .1s}
.export-option:hover{background:var(--bg2)}
.export-option i{font-size:22px;color:var(--text2)}
.export-option-text p{font-size:13px;font-weight:500;margin-bottom:1px}
.export-option-text span{font-size:12px;color:var(--text3)}
.upload-area{border:1.5px dashed var(--border2);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;color:var(--text2);font-size:13px;transition:border-color .1s;position:relative}
.upload-area:hover{border-color:var(--blue)}
.upload-preview{width:100%;max-height:160px;object-fit:cover;border-radius:var(--radius);margin-top:10px;display:none}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.lightbox-inner{background:var(--bg);border-radius:var(--radius-lg);max-width:500px;width:100%;overflow:hidden}
.lightbox-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:80px;background:var(--bg2)}
.lightbox-info{padding:14px 16px}
.lightbox-close{position:absolute;top:20px;right:20px;width:36px;height:36px;background:rgba(255,255,255,.15);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:13px;display:flex;align-items:center;gap:8px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:600px){
  .sidebar{width:56px}
  .sidebar-title span,.sidebar-section,.sidebar-item span,.sidebar-item .label{display:none}
  .sidebar-item{justify-content:center;padding:10px}
  .tag-dot{margin:0}
  .topbar h2{font-size:14px}
  .search-input{width:120px}
}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-title"><i class="ti ti-photo"></i><span> Mi álbum</span></div>
    <div class="sidebar-section">Vistas</div>
    <div class="sidebar-item active" onclick="setView('all',this)"><i class="ti ti-layout-grid"></i><span class="label">Todas las fotos</span></div>
    <div class="sidebar-item" onclick="setView('fav',this)"><i class="ti ti-heart"></i><span class="label">Favoritas</span></div>
    <div class="sidebar-section">Álbumes</div>
    <div id="album-list"></div>
    <div class="sidebar-item" onclick="showNewAlbum()"><i class="ti ti-plus"></i><span class="label">Nuevo álbum</span></div>
    <div class="sidebar-section">Etiquetas</div>
    <div id="tag-sidebar"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <h2 id="view-title">Todas las fotos</h2>
      <div class="search-wrap"><i class="ti ti-search"></i><input class="search-input" placeholder="Buscar..." oninput="render()" id="search"></div>
      <button class="btn btn-success" onclick="showExport()"><i class="ti ti-download"></i> Exportar</button>
      <button class="btn btn-primary" onclick="showAddPhoto()"><i class="ti ti-plus"></i> Añadir</button>
    </div>
    <div class="content">
      <div class="filter-bar" id="filter-bar"></div>
      <div class="photo-grid" id="grid"></div>
    </div>
  </div>
</div>

<div id="modal"></div>
<div class="toast" id="toast"><i class="ti ti-check"></i> <span id="toast-msg"></span></div>

<script>
const COLORS={
  viaje:['#E6F1FB','#185FA5'],familia:['#FAECE7','#993C1D'],
  naturaleza:['#EAF3DE','#3B6D11'],comida:['#FAEEDA','#854F0B'],
  eventos:['#EEEDFE','#3C3489'],mascotas:['#FBEAF0','#72243E'],ciudad:['#F1EFE8','#5F5E5A']
};
const ALL_TAGS=Object.keys(COLORS);
const EMOJIS_ADD=['🌄','📸','🖼️','🌈','🎞️','🌍','🏡','🦋','🎨','🌺'];

let photos=JSON.parse(localStorage.getItem('album_photos')||'null')||[
  {id:1,name:'Atardecer en Bali',album:'Viajes 2024',tags:['viaje','naturaleza'],fav:true,emoji:'🌅',date:'2024-03-12',src:''},
  {id:2,name:'Cumpleaños Ana',album:'Familia',tags:['familia','eventos'],fav:false,emoji:'🎉',date:'2024-06-01',src:''},
  {id:3,name:'Montaña Nevada',album:'Viajes 2024',tags:['viaje','naturaleza'],fav:true,emoji:'🏔️',date:'2024-01-20',src:''},
  {id:4,name:'Paella del domingo',album:'Sin álbum',tags:['comida','familia'],fav:false,emoji:'🍂',date:'2024-08-15',src:''},
  {id:5,name:'Max durmiendo',album:'Mascotas',tags:['mascotas'],fav:true,emoji:'🐾',date:'2024-09-03',src:''},
  {id:6,name:'Barcelona de noche',album:'Sin álbum',tags:['ciudad','viaje'],fav:false,emoji:'🏙️',date:'2024-11-22',src:''},
];
let albums=JSON.parse(localStorage.getItem('album_albums')||'null')||['Viajes 2024','Familia','Mascotas'];
let currentView='all',currentViewLabel='Todas las fotos',activeTagFilter=null;

function save(){localStorage.setItem('album_photos',JSON.stringify(photos));localStorage.setItem('album_albums',JSON.stringify(albums));}

function setView(v,el){
  currentView=v;
  document.querySelectorAll('.sidebar-item').forEach(e=>e.classList.remove('active'));
  if(el)el.classList.add('active');
  currentViewLabel=v==='all'?'Todas las fotos':v==='fav'?'Favoritas':v.startsWith('album:')?v.slice(6):v;
  document.getElementById('view-title').textContent=currentViewLabel;
  activeTagFilter=null;render();
}

function renderSidebar(){
  document.getElementById('album-list').innerHTML=albums.map(a=>
    `<div class="sidebar-item" onclick="setView('album:${a}',this)"><i class="ti ti-folder"></i><span class="label">${a}</span></div>`
  ).join('');
  document.getElementById('tag-sidebar').innerHTML=ALL_TAGS.map(t=>{
    const[,txt]=COLORS[t];
    return`<div class="sidebar-item" onclick="setTagFilter('${t}')"><span class="tag-dot" style="background:${txt}"></span><span class="label">${t.charAt(0).toUpperCase()+t.slice(1)}</span></div>`;
  }).join('');
}

function setTagFilter(tag){
  activeTagFilter=activeTagFilter===tag?null:tag;
  currentView='all';currentViewLabel='Todas las fotos';
  document.querySelectorAll('.sidebar-item').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-title').textContent=currentViewLabel;render();
}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  let list=photos.filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q)&&!p.tags.join(' ').includes(q))return false;
    if(currentView==='fav')return p.fav;
    if(currentView.startsWith('album:'))return p.album===currentView.slice(6);
    return true;
  });
  if(activeTagFilter)list=list.filter(p=>p.tags.includes(activeTagFilter));
  return list;
}

function render(){
  const list=getFiltered();
  const usedTags=[...new Set(photos.flatMap(p=>p.tags))];
  document.getElementById('filter-bar').innerHTML=usedTags.map(t=>{
    const[bg,txt]=COLORS[t]||['#eee','#333'];
    const act=activeTagFilter===t?'active':'';
    return`<span class="tag-pill ${act}" style="background:${bg};color:${txt};${act?'border-color:'+txt:''}" onclick="setTagFilter('${t}')">${t}</span>`;
  }).join('');
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><i class="ti ti-mood-empty"></i><p>No hay fotos aquí aún</p></div>`;return;}
  grid.innerHTML=list.map(p=>{
    const tagsHtml=p.tags.map(t=>{const[bg,txt]=COLORS[t]||['#eee','#333'];return`<span class="mini-tag" style="background:${bg};color:${txt}">${t}</span>`;}).join('');
    const thumb=p.src?`<img class="photo-thumb" src="${p.src}" alt="${p.name}" loading="lazy">`:`<div class="photo-thumb-fake">${p.emoji}</div>`;
    return`<div class="photo-card">
      <div onclick="openPhoto(${p.id})" style="cursor:pointer">${thumb}</div>
      <div class="card-actions">
        <div class="card-btn" onclick="toggleFav(${p.id},event)" title="${p.fav?'Quitar de favoritas':'Añadir a favoritas'}"><i class="ti ti-heart" style="color:${p.fav?'#E24B4A':'inherit'}"></i></div>
        <div class="card-btn" onclick="showEdit(${p.id})" title="Editar"><i class="ti ti-edit"></i></div>
        <div class="card-btn" onclick="deletePhoto(${p.id})" title="Eliminar" style="color:#E24B4A"><i class="ti ti-trash"></i></div>
      </div>
      <div class="photo-info">
        <div class="photo-name">${p.name}</div>
        <div style="font-size:11px;color:var(--text3);margin:2px 0 4px">${p.album} · ${p.date}</div>
        <div class="photo-tags">${tagsHtml}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleFav(id,e){e&&e.stopPropagation();const p=photos.find(x=>x.id===id);if(p){p.fav=!p.fav;save();render();}}

function deletePhoto(id){
  if(!confirm('¿Eliminar esta foto?'))return;
  photos=photos.filter(p=>p.id!==id);save();render();toast('Foto eliminada');
}

function openPhoto(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  const tagsHtml=p.tags.map(t=>{const[bg,txt]=COLORS[t]||['#eee','#333'];return`<span class="mini-tag" style="background:${bg};color:${txt};margin-right:4px">${t}</span>`;}).join('');
  const thumb=p.src?`<img src="${p.src}" style="width:100%;max-height:320px;object-fit:cover;display:block" alt="${p.name}">`:`<div class="lightbox-img">${p.emoji}</div>`;
  document.getElementById('modal').innerHTML=`<div class="lightbox" onclick="closeModal(event)">
    <button class="lightbox-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    <div class="lightbox-inner" onclick="event.stopPropagation()">
      ${thumb}
      <div class="lightbox-info">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px">
          <strong style="font-size:15px">${p.name}</strong>
          <i class="ti ti-heart" style="font-size:18px;cursor:pointer;color:${p.fav?'#E24B4A':'var(--text3)'}" onclick="toggleFav(${p.id});closeModal()"></i>
        </div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:8px">${p.album} · ${p.date}</div>
        <div>${tagsHtml}</div>
      </div>
    </div>
  </div>`;
}

function showAddPhoto(){
  const albumOpts=['Sin álbum',...albums].map(a=>`<option>${a}</option>`).join('');
  const tagChecks=ALL_TAGS.map(t=>`<span class="check-tag" onclick="this.classList.toggle('sel')">${t}</span>`).join('');
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">
    <h3>Añadir foto</h3>
    <div class="upload-area" onclick="document.getElementById('fi').click()">
      <input type="file" id="fi" accept="image/*" style="display:none" onchange="previewUpload(this)">
      <i class="ti ti-upload" style="font-size:26px;display:block;margin-bottom:6px"></i>
      <div id="ulbl">Haz clic para subir una imagen</div>
      <img id="preview-img" class="upload-preview">
    </div>
    <div class="field" style="margin-top:12px"><label>Nombre</label><input id="pname" placeholder="Nombre de la foto" autofocus></div>
    <div class="field"><label>Fecha</label><input type="date" id="pdate" value="${today}"></div>
    <div class="field"><label>Álbum</label><select id="palbum">${albumOpts}</select></div>
    <div class="field"><label>Etiquetas</label><div class="check-grid" id="ptags">${tagChecks}</div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="addPhoto()">Añadir</button></div>
  </div></div>`;
}

function previewUpload(input){
  if(input.files&&input.files[0]){
    const r=new FileReader();
    r.onload=e=>{
      document.getElementById('preview-img').src=e.target.result;
      document.getElementById('preview-img').style.display='block';
      document.getElementById('ulbl').textContent='✓ '+input.files[0].name;
    };
    r.readAsDataURL(input.files[0]);
  }
}

function addPhoto(){
  const fi=document.getElementById('fi');
  const name=document.getElementById('pname').value.trim()||'Sin título';
  const album=document.getElementById('palbum').value;
  const tags=[...document.querySelectorAll('#ptags .check-tag.sel')].map(e=>e.textContent);
  const date=document.getElementById('pdate').value;
  const emojis=['🌄','📸','🖼️','🌈','🎞️','🌍','🏡'];
  const doAdd=src=>{photos.push({id:Date.now(),name,album,tags,fav:false,emoji:emojis[Math.floor(Math.random()*emojis.length)],date,src});save();closeModal();render();toast('Foto añadida');};
  if(fi.files&&fi.files[0]){const r=new FileReader();r.onload=e=>doAdd(e.target.result);r.readAsDataURL(fi.files[0]);}
  else doAdd('');
}

function showEdit(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  const albumOpts=['Sin álbum',...albums].map(a=>`<option${p.album===a?' selected':''}>${a}</option>`).join('');
  const tagChecks=ALL_TAGS.map(t=>`<span class="check-tag${p.tags.includes(t)?' sel':''}" onclick="this.classList.toggle('sel')">${t}</span>`).join('');
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">
    <h3>Editar foto</h3>
    <div class="field"><label>Nombre</label><input id="pname" value="${p.name}"></div>
    <div class="field"><label>Fecha</label><input type="date" id="pdate" value="${p.date}"></div>
    <div class="field"><label>Álbum</label><select id="palbum">${albumOpts}</select></div>
    <div class="field"><label>Etiquetas</label><div class="check-grid" id="ptags">${tagChecks}</div></div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deletePhoto(${id});closeModal()"><i class="ti ti-trash"></i> Eliminar</button>
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEdit(${id})">Guardar</button>
    </div>
  </div></div>`;
}

function saveEdit(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  p.name=document.getElementById('pname').value.trim()||p.name;
  p.date=document.getElementById('pdate').value;
  p.album=document.getElementById('palbum').value;
  p.tags=[...document.querySelectorAll('#ptags .check-tag.sel')].map(e=>e.textContent);
  save();closeModal();render();toast('Cambios guardados');
}

function showExport(){
  const list=getFiltered();
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">
    <h3><i class="ti ti-download" style="margin-right:6px"></i>Exportar álbum</h3>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">${list.length} foto${list.length!==1?'s':''} · <em>${currentViewLabel}</em></p>
    <div class="export-option" onclick="exportJSON()"><i class="ti ti-file-code"></i><div class="export-option-text"><p>JSON</p><span>Datos estructurados para importar en otra app</span></div></div>
    <div class="export-option" onclick="exportHTML()"><i class="ti ti-file-type-html"></i><div class="export-option-text"><p>HTML visual</p><span>Página lista para compartir o imprimir</span></div></div>
    <div class="export-option" onclick="exportCSV()"><i class="ti ti-table"></i><div class="export-option-text"><p>CSV</p><span>Tabla de metadatos para Excel o Google Sheets</span></div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>
  </div></div>`;
}

function exportJSON(){
  const list=getFiltered();
  download(`album-${slug(currentViewLabel)}.json`,JSON.stringify({album:currentViewLabel,exportedAt:new Date().toISOString(),total:list.length,photos:list},null,2),'application/json');
  toast('JSON descargado');closeModal();
}
function exportHTML(){
  const list=getFiltered();
  const cards=list.map(p=>{
    const tags=p.tags.map(t=>{const[bg,txt]=COLORS[t]||['#eee','#333'];return`<span style="background:${bg};color:${txt};padding:2px 8px;border-radius:10px;font-size:11px">${t}</span>`;}).join(' ');
    const img=p.src?`<img src="${p.src}" style="width:100%;height:160px;object-fit:cover;display:block">`:`<div style="font-size:52px;text-align:center;padding:20px;background:#f9fafb">${p.emoji}</div>`;
    return`<div style="border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:#fff">${img}<div style="padding:10px 12px"><strong style="font-size:13px">${p.name}</strong><div style="font-size:11px;color:#6b7280;margin:3px 0 6px">${p.album} · ${p.date}${p.fav?' · ⭐':''}</div><div style="display:flex;gap:4px;flex-wrap:wrap">${tags}</div></div></div>`;
  }).join('');
  download(`album-${slug(currentViewLabel)}.html`,`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${currentViewLabel}</title></head><body style="font-family:sans-serif;max-width:900px;margin:40px auto;padding:0 20px"><h1 style="font-size:22px;margin-bottom:6px">${currentViewLabel}</h1><p style="color:#6b7280;font-size:13px;margin-bottom:24px">${list.length} foto${list.length!==1?'s':''} · ${new Date().toLocaleDateString('es-ES')}</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">${cards}</div></body></html>`,'text/html');
  toast('HTML descargado');closeModal();
}
function exportCSV(){
  const list=getFiltered();
  const rows=[['ID','Nombre','Álbum','Etiquetas','Favorita','Fecha'],...list.map(p=>[p.id,`"${p.name}"`,`"${p.album}"`,`"${p.tags.join(', ')}"`,p.fav?'Sí':'No',p.date])];
  download(`album-${slug(currentViewLabel)}.csv`,rows.map(r=>r.join(',')).join('\n'),'text/csv');
  toast('CSV descargado');closeModal();
}

function showNewAlbum(){
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">
    <h3>Nuevo álbum</h3>
    <div class="field"><label>Nombre</label><input id="aname" placeholder="Ej: Vacaciones 2025" autofocus></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="addAlbum()">Crear</button></div>
  </div></div>`;
}
function addAlbum(){const n=document.getElementById('aname').value.trim();if(n&&!albums.includes(n)){albums.push(n);save();renderSidebar();}closeModal();}
function closeModal(e){if(!e||e.target.classList.contains('modal-bg')||e.target.classList.contains('lightbox'))document.getElementById('modal').innerHTML='';}
function download(filename,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}
function toast(msg){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

renderSidebar();render();
</script>
</body>
</html>
